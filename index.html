<style>
  :root {
    --font-heading: 'Manrope', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: var(--font-body), sans-serif;
    min-height: 100%;
  }

  /* ===================== Password gate ===================== */
  #mr-gate {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
    padding: 24px;
  }
  #mr-gate .mr-gate-glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(110px);
    pointer-events: none;
    opacity: 0.35;
    z-index: 0;
    animation: mr-gate-drift 24s ease-in-out infinite;
  }
  #mr-gate .mr-gate-glow--1 { width: 480px; height: 480px; background: #F472B6; top: -120px; left: -120px; }
  #mr-gate .mr-gate-glow--2 { width: 520px; height: 520px; background: #60A5FA; bottom: -160px; right: -140px; animation-direction: reverse; }
  #mr-gate .mr-gate-glow--3 { width: 380px; height: 380px; background: #C084FC; top: 40%; left: 60%; animation-duration: 30s; }
  @keyframes mr-gate-drift {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(50px, 30px); }
  }

  .mr-gate__panel {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .mr-gate__wordmark {
    font-family: var(--font-heading), serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(30px, 6vw, 42px);
    margin: 0 0 10px;
    background: linear-gradient(90deg, #F9A8D4, #93C5FD, #D8B4FE, #F9A8D4);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: mr-gate-shimmer 7s ease-in-out infinite;
    text-shadow: 0 0 40px rgba(216,180,254,0.25);
  }
  @keyframes mr-gate-shimmer {
    0%   { background-position: 0% center; }
    50%  { background-position: 100% center; }
    100% { background-position: 0% center; }
  }
  .mr-gate__tagline {
    font-size: 15px;
    line-height: 1.6;
    letter-spacing: 0.01em;
    color: rgba(255,255,255,0.55);
    margin: 0 0 36px;
  }
  .mr-gate__form {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .mr-gate__input {
    width: 100%;
    font-family: var(--font-body), sans-serif;
    font-size: 16px;
    text-align: center;
    letter-spacing: 0.04em;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.05);
    color: #fff;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .mr-gate__input::placeholder { color: rgba(255,255,255,0.35); }
  .mr-gate__input:focus {
    border-color: rgba(216,180,254,0.7);
    box-shadow: 0 0 0 3px rgba(216,180,254,0.18);
  }
  .mr-gate__input.mr-gate--shake {
    animation: mr-gate-shake 0.4s ease;
    border-color: rgba(244,114,182,0.8);
  }
  @keyframes mr-gate-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  .mr-gate__btn {
    font-family: var(--font-body), sans-serif;
    font-weight: 600;
    font-size: 15px;
    padding: 13px 24px;
    border-radius: 10px;
    border: 2px solid #fff;
    background: transparent;
    color: #fff;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, transform 0.13s ease;
  }
  .mr-gate__btn:hover { background: #fff; color: #0d0a0a; transform: translateY(-2px); }
  .mr-gate__error {
    min-height: 18px;
    font-size: 13px;
    color: #F9A8D4;
    margin: 2px 0 0;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .mr-gate__error.mr-gate--visible { opacity: 1; }

  #mr-gate.mr-gate--hidden {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }

  #mr-content-root {
    min-height: 100vh;
    background: #000;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  #mr-content-root.mr-content--visible { opacity: 1; }

  .mr-hero {
    width: 100%;
    overflow: hidden;
    background: #000;
    line-height: 0;
  }
  .mr-hero__img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 80vh;
    object-fit: cover;
    object-position: center;
  }
  @media (max-width: 749px) {
    .mr-hero__img {
      max-height: none;
      object-fit: contain;
    }
  }

  @media (max-width: 480px) {
    #mr-gate .mr-gate-glow { filter: blur(70px); }
  }
</style>

  <!-- ORIGIN STORY -->
  <section class="mr-section mr-story mr-fade">
    <div class="mr-section__inner mr-section__inner--wide">
      <h2 class="mr-heading">The Story of <em class="mr-gradient">Mattarot</em></h2>

      <div class="mr-row">
        <div class="mr-row__text">
          <p>Ever since he was a kid, Matt knew there was <em class="mr-gradient">magic</em> in the world, and that he was drawn to it. A sensitive, curious child, he loved crystals, ghost stories, and anything that touched the unseen. Growing up in a difficult household, he found refuge in the magical worlds of Final Fantasy, The Legend of Zelda, Sailor Moon, Cardcaptor Sakura, and Escaflowne, stories where the mystical was real and the ordinary was never quite what it seemed.</p>
        </div>
        <div class="mr-row__image">
          <img src="https://cdn.shopify.com/s/files/1/0017/1229/1862/files/DSCF9442.jpg?v=1633374546" alt="">
        </div>
      </div>

      <div class="mr-row mr-row--reverse">
        <div class="mr-row__text">
          <p>A high school friend introduced him to tarot, and something clicked. With Italian roots of his own, he traced the cards back to Tarocchi, the centuries-old Italian card game that slowly transformed into the divination tool it's known as today. That thread of curiosity followed him into his twenties, where it grew into a full practice: meditation, tantra, energy healing, crystal work, and a wide-ranging study of theology and spiritual traditions beyond his own upbringing.</p>
        </div>
        <div class="mr-row__image">
          <img src="https://cdn.shopify.com/s/files/1/0017/1229/1862/files/2P6A9711_copy.JPEG?v=1615921681" alt="">
        </div>
      </div>

      <div class="mr-row">
        <div class="mr-row__text">
          <p>The turning point came at a local crystal shop, where the tarot readers working there noticed his gift and encouraged him to share it. That gentle nudge became Mattarot: readings for local clients and people online, followed by content exploring spirituality more broadly.</p>
          <p>Giving readings felt like home. Helping people tap into the <em class="mr-gradient">magic</em> already present in their everyday lives, and using it to find clarity and direction, brought Matt real joy. That joy planted the seed for what would eventually grow into something bigger.</p>
        </div>
        <div class="mr-row__image">
          <img src="https://cdn.shopify.com/s/files/1/0017/1229/1862/files/Untitled_design_4.png?v=1683040856" alt="">
        </div>
      </div>

    </div>
  </section>

  <!-- WHAT IT'S BECOME -->
  <section class="mr-section mr-become mr-fade">
    <div class="mr-section__inner">
      <h2 class="mr-heading">What <em class="mr-gradient">Mattarot</em> Has Become</h2>
      <p>Today, Mattarot lives on, not as a business, but as a creative and spiritual home. It's the space where Matt's love of mysticism, storytelling, and collaboration gets to exist without the pressure of a bottom line.</p>
      <p>He's currently collaborating with queer artists to design tarot decks, with more to come.</p>
      <p>It's the first of what's meant to be an ongoing pattern, creative collaborations with other artists and dreamers who want to bring a little magic into the world. If you want to collab, reach out, Instagram is best.</p>

        <p class="mt-lede">Take one message before you go. Tap the card to draw it, this is a one-pull reading, so let it be the one you need.</p>

        <div class="mt-stage">
          <div class="mt-card" id="mtCard">

<script>
  (function () {
    var items = document.querySelectorAll('.mattarot-page .mr-fade');

    if (!('IntersectionObserver' in window)) {
      items.forEach(function (el) { el.classList.add('mr-visible'); });
      return;
    }

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('mr-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });

    // Anything already on screen when the page loads gets revealed right
    // away instead of waiting on a scroll event that may not fire reliably
    // on every device/viewport size. Everything still below the fold keeps
    // the normal scroll-triggered reveal via the observer.
    function revealIfAlreadyVisible(el) {
      var rect = el.getBoundingClientRect();
      var viewportHeight = window.innerHeight || document.documentElement.clientHeight;
      var isInView = rect.top < viewportHeight * 0.9 && rect.bottom > 0;
      if (isInView) {
        el.classList.add('mr-visible');
      } else {
        observer.observe(el);
      }
    }

    items.forEach(revealIfAlreadyVisible);
  })();

<script>
  (function () {
    var audio = document.getElementById('mrAudio');
    var btn = document.getElementById('mrSoundBtn');
    var playIcon = btn.querySelector('.mr-sound-icon--play');
    var pauseIcon = btn.querySelector('.mr-sound-icon--pause');
    var TARGET_VOLUME = 0.35; // kept deliberately quiet, this is background ambience

    function fadeVolumeTo(target, duration) {
      var steps = 20;
      var stepTime = duration / steps;
      var startVolume = audio.volume;
      var stepAmount = (target - startVolume) / steps;
      var count = 0;
      var timer = setInterval(function () {
        count++;
        var next = startVolume + stepAmount * count;
        audio.volume = Math.min(1, Math.max(0, next));
        if (count >= steps) clearInterval(timer);
      }, stepTime);
    }

    function setIdleUI() {
      btn.classList.remove('is-playing');
      btn.setAttribute('aria-pressed', 'false');
      btn.setAttribute('aria-label', 'Play ambient music');
      playIcon.style.display = '';
      pauseIcon.style.display = 'none';
    }

    function setPlayingUI() {
      btn.classList.add('is-playing');
      btn.setAttribute('aria-pressed', 'true');
      btn.setAttribute('aria-label', 'Pause ambient music');
      playIcon.style.display = 'none';
      pauseIcon.style.display = '';
    }

    btn.addEventListener('click', function () {
      if (audio.paused) {
        audio.volume = 0;
        audio.play();
        fadeVolumeTo(TARGET_VOLUME, 1200);
        setPlayingUI();
      } else {
        audio.pause();
        setIdleUI();
      }
    });

    // Plays once per click instead of looping. When the track finishes on
    // its own, reset the button to idle and rewind it so the next click
    // starts the track over from the beginning rather than doing nothing.
    audio.addEventListener('ended', function () {
      setIdleUI();
      audio.currentTime = 0;
    });
  })();
<\/script>`;

    var PASSWORD = 'shineyourlight';
    var STORAGE_KEY = 'mr_unlocked';

    var gate = document.getElementById('mr-gate');
    var form = document.getElementById('mrGateForm');
    var input = document.getElementById('mrGatePassword');
    var errorEl = document.getElementById('mrGateError');
    var root = document.getElementById('mr-content-root');

    function isUnlockedThisSession() {
      try {
        return sessionStorage.getItem(STORAGE_KEY) === 'true';
      } catch (e) {
        return false;
      }
    }

    function rememberUnlock() {
      try {
        sessionStorage.setItem(STORAGE_KEY, 'true');
      } catch (e) {
        // storage blocked (private browsing, etc.) — degrade gracefully,
        // the visitor will just be asked again on the next reload.
      }
    }

    function revealContent() {
      root.innerHTML = MR_CONTENT;

      // innerHTML-inserted <script> tags don't execute automatically, so
      // each one is recreated and re-inserted here to run in order.
      var oldScripts = root.querySelectorAll('script');
      for (var i = 0; i < oldScripts.length; i++) {
        var oldScript = oldScripts[i];
        var newScript = document.createElement('script');
        for (var j = 0; j < oldScript.attributes.length; j++) {
          var attr = oldScript.attributes[j];
          newScript.setAttribute(attr.name, attr.value);
        }
        newScript.textContent = oldScript.textContent;
        oldScript.parentNode.replaceChild(newScript, oldScript);
      }

      gate.classList.add('mr-gate--hidden');

      // Double rAF so the browser registers the starting opacity:0 before
      // the class flips, otherwise the transition can get skipped and the
      // content just pops in instead of fading in smoothly.
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          root.classList.add('mr-content--visible');
        });
      });

      setTimeout(function () {
        if (gate && gate.parentNode) {
          gate.parentNode.removeChild(gate);
        }
      }, 650);
    }

    function showError() {
      errorEl.classList.add('mr-gate--visible');
      input.classList.add('mr-gate--shake');
      input.value = '';
      input.focus();
      setTimeout(function () {
        input.classList.remove('mr-gate--shake');
      }, 400);
    }

    function attemptUnlock() {
      var entered = (input.value || '').trim().toLowerCase();
      if (entered === PASSWORD) {
        rememberUnlock();
        revealContent();
      } else {
        showError();
      }
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      attemptUnlock();
    });

    if (isUnlockedThisSession()) {
      gate.style.display = 'none';
      revealContent();
    } else {
      input.focus();
    }
  })();
  </script>
